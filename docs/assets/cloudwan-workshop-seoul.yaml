AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AWS Cloud WAN workshop (L200), Seoul stack: a global network, a core network
  with the four segments prod / dev / shared / onprem and the two edge locations
  ap-northeast-2 and us-west-2, the three Seoul VPCs prod / dev / shared with one
  test EC2 instance each and a Cloud WAN VPC attachment each, a simulated
  on-premises VPC with a strongSwan + FRR VPN router and an inside VM, and a
  customer gateway that points at the router's Elastic IP. You create the
  Site-to-Site VPN connection, its Cloud WAN VPN attachment and the Oregon VPC
  attachment in the console during the workshop.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Nothing to enter - deploy with the defaults" }
        Parameters:
          - ImageId
          - RouterImageId
          - InstanceType
      - Label: { default: "Addresses and ASNs (leave the defaults)" }
        Parameters:
          - ProdVpcCidr
          - DevVpcCidr
          - SharedVpcCidr
          - OnPremVpcCidr
          - CustomerGatewayAsn

Parameters:
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: AMI for the four test instances. Amazon Linux 2023, arm64, resolved from the SSM public parameter.
  RouterImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: >-
      AMI for the on-premises VPN router only. Leave the default. The router needs
      strongSwan (IPsec) and FRR (BGP). Neither is in the Amazon Linux 2023 core
      repository, but both are in SPAL (Supplementary Packages for Amazon Linux),
      which the bootstrap enables with `dnf install spal-release`. All five
      instances in this stack therefore run Amazon Linux 2023 arm64. The bootstrap
      also handles a Debian or Ubuntu AMI, so this parameter is kept separate as
      an escape hatch; on any AMI without the packages it stops with an explicit
      error and writes /opt/onprem/BOOTSTRAP-FAILED rather than leaving a
      half-built router behind.
  InstanceType:
    Type: String
    Default: t4g.micro
    AllowedPattern: "^[a-z0-9]+[a-z]?\\.[a-z0-9]+$"
    ConstraintDescription: Enter an arm64 (Graviton) instance type, for example t4g.micro.
    Description: Instance type for every instance in this stack. Must be an arm64 type to match the AMIs above.
  ProdVpcCidr:
    Type: String
    Default: 10.10.1.0/24
    AllowedValues: [10.10.1.0/24]
    Description: Fixed at 10.10.1.0/24; the subnets and the test instance address are derived from it.
  DevVpcCidr:
    Type: String
    Default: 10.20.1.0/24
    AllowedValues: [10.20.1.0/24]
    Description: Fixed at 10.20.1.0/24; the subnets and the test instance address are derived from it.
  SharedVpcCidr:
    Type: String
    Default: 10.30.1.0/24
    AllowedValues: [10.30.1.0/24]
    Description: Fixed at 10.30.1.0/24; the subnets and the test instance address are derived from it.
  OnPremVpcCidr:
    Type: String
    Default: 172.16.1.0/24
    AllowedValues: [172.16.1.0/24]
    Description: Fixed at 172.16.1.0/24; the router script advertises this CIDR over BGP.
  CustomerGatewayAsn:
    Type: Number
    Default: 65000
    MinValue: 1
    MaxValue: 4294967294
    Description: BGP ASN of the simulated on-premises router.

Resources:
  # ================================================================ Cloud WAN
  GlobalNetwork:
    Type: AWS::NetworkManager::GlobalNetwork
    Properties:
      Description: cwan-ws global network
      Tags:
        - { Key: Name, Value: cwan-ws-global }

  # First creation of a core network with an inline policy can take up to 30
  # minutes. Nothing else in the core network can be changed while it runs.
  CoreNetwork:
    Type: AWS::NetworkManager::CoreNetwork
    Properties:
      GlobalNetworkId: !GetAtt GlobalNetwork.Id
      Description: cwan-ws core network
      PolicyDocument:
        version: "2021.12"
        core-network-configuration:
          asn-ranges: ["64512-64520"]
          vpn-ecmp-support: true
          edge-locations:
            # Literal integers on purpose: a Number parameter read with !Ref
            # resolves to a string, and the edge ASN must be a JSON number.
            # These cannot be changed after the core network is created.
            - { location: ap-northeast-2, asn: 64512 }
            - { location: us-west-2, asn: 64513 }
        segments:
          - { name: prod, description: "Production", require-attachment-acceptance: false }
          - { name: dev, description: "Development", require-attachment-acceptance: false }
          - { name: shared, description: "Shared services", require-attachment-acceptance: false }
          - { name: onprem, description: "On-premises", require-attachment-acceptance: false }
        segment-actions:
          # shared reaches prod, dev and onprem. They do not reach each other.
          # onprem starts with no share at all - lab 2-4 adds onprem -> prod.
          - action: share
            mode: attachment-route
            segment: shared
            share-with: [prod, dev, onprem]
        attachment-policies:
          - rule-number: 100
            description: Put an attachment in the segment named by its segment tag
            conditions:
              - { type: tag-exists, key: segment }
            action:
              association-method: tag
              tag-value-of-key: segment
      Tags:
        - { Key: Name, Value: cwan-ws-core }

  # ================================================================ prod VPC
  ProdVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref ProdVpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: cwan-ws-vpc-prod }

  ProdAppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProdVpc
      CidrBlock: 10.10.1.0/26
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: cwan-ws-prod-app-az1 }

  # A Cloud WAN VPC attachment takes exactly one subnet per Availability Zone.
  ProdCwanSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProdVpc
      CidrBlock: 10.10.1.224/28
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: cwan-ws-prod-cwan-az1 }

  ProdCwanSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProdVpc
      CidrBlock: 10.10.1.240/28
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - { Key: Name, Value: cwan-ws-prod-cwan-az2 }

  ProdAppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ProdVpc
      Tags:
        - { Key: Name, Value: cwan-ws-prod-app }

  ProdAppRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProdAppSubnet
      RouteTableId: !Ref ProdAppRouteTable

  ProdCwanRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ProdVpc
      Tags:
        - { Key: Name, Value: cwan-ws-prod-cwan }

  ProdCwanRouteTableAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProdCwanSubnetA
      RouteTableId: !Ref ProdCwanRouteTable

  ProdCwanRouteTableAssocC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProdCwanSubnetC
      RouteTableId: !Ref ProdCwanRouteTable

  ProdAttachment:
    Type: AWS::NetworkManager::VpcAttachment
    Properties:
      CoreNetworkId: !GetAtt CoreNetwork.CoreNetworkId
      VpcArn: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${ProdVpc}"
      SubnetArns:
        - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${ProdCwanSubnetA}"
        - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${ProdCwanSubnetC}"
      Options:
        ApplianceModeSupport: false
        Ipv6Support: false
      Tags:
        - Key: Name
          Value: !Sub
            - "cwan-ws-att-prod-${R}"
            - R: !FindInMap [RegionCode, !Ref "AWS::Region", Short]
        - { Key: segment, Value: prod }

  ProdRouteCloudPrefix:
    Type: AWS::EC2::Route
    DependsOn: ProdAttachment
    Properties:
      RouteTableId: !Ref ProdAppRouteTable
      DestinationCidrBlock: 10.0.0.0/8
      CoreNetworkArn: !GetAtt CoreNetwork.CoreNetworkArn

  ProdRouteOnPremPrefix:
    Type: AWS::EC2::Route
    DependsOn: ProdAttachment
    Properties:
      RouteTableId: !Ref ProdAppRouteTable
      DestinationCidrBlock: 172.16.0.0/12
      CoreNetworkArn: !GetAtt CoreNetwork.CoreNetworkArn

  # Lets dnf reach the AL2023 repositories without a NAT gateway.
  ProdS3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ProdVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref ProdAppRouteTable]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Al2023Repos
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::al2023-repos-${AWS::Region}-*/*"

  ProdEiceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cwan-ws prod EICE, SSH out to the test EC2 only
      VpcId: !Ref ProdVpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          DestinationSecurityGroupId: !Ref ProdEc2Sg
          Description: SSH to the test EC2
      Tags:
        - { Key: Name, Value: cwan-ws-prod-eice }

  # Cloud WAN segments decide what can talk to what. This security group must
  # never be the thing that blocks a ping, or the isolation lab proves nothing.
  ProdEc2Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cwan-ws prod test EC2. Open to every lab CIDR on purpose.
      VpcId: !Ref ProdVpc
      SecurityGroupIngress:
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 10.0.0.0/8, Description: ping from any lab VPC }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 10.0.0.0/8, Description: curl from any lab VPC }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 172.16.0.0/12, Description: ping from on-premises }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 172.16.0.0/12, Description: curl from on-premises }
      Tags:
        - { Key: Name, Value: cwan-ws-prod-ec2 }

  ProdEc2SgSshFromEice:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ProdEc2Sg
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId: !Ref ProdEiceSg
      Description: SSH from EICE only

  ProdEice:
    Type: AWS::EC2::InstanceConnectEndpoint
    DependsOn: ProdInstance  # its ENI must not take the instance's fixed IP
    Properties:
      SubnetId: !Ref ProdAppSubnet
      SecurityGroupIds: [!Ref ProdEiceSg]
      PreserveClientIp: false
      Tags:
        - { Key: Name, Value: cwan-ws-prod-eice }

  ProdInstance:
    Type: AWS::EC2::Instance
    DependsOn: [ProdS3Endpoint, ProdAppRouteTableAssoc]
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeType: gp3, VolumeSize: 8, Encrypted: true, DeleteOnTermination: true }
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref ProdAppSubnet
          GroupSet: [!Ref ProdEc2Sg]
          PrivateIpAddress: 10.10.1.10
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            hostnamectl set-hostname ${Host}
            install -d -m 0755 /opt/cwanws
            cat > /opt/cwanws/whoami.py <<'PY'
            ${WhoAmI}
            PY
            cat > /etc/systemd/system/cwanws-whoami.service <<'UNIT'
            ${Unit}
            UNIT
            systemctl daemon-reload
            systemctl enable --now cwanws-whoami
            # test tools last, so a dnf failure cannot block the HTTP server
            dnf install -y tcpdump bind-utils
          - Host: cwan-ws-prod
            WhoAmI: !FindInMap [Scripts, Http, Py]
            Unit: !FindInMap [Scripts, Http, Unit]
      Tags:
        - { Key: Name, Value: cwan-ws-prod-ec2 }

  # ================================================================ dev VPC
  DevVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref DevVpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: cwan-ws-vpc-dev }

  DevAppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DevVpc
      CidrBlock: 10.20.1.0/26
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: cwan-ws-dev-app-az1 }

  DevCwanSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DevVpc
      CidrBlock: 10.20.1.224/28
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: cwan-ws-dev-cwan-az1 }

  DevCwanSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DevVpc
      CidrBlock: 10.20.1.240/28
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - { Key: Name, Value: cwan-ws-dev-cwan-az2 }

  DevAppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DevVpc
      Tags:
        - { Key: Name, Value: cwan-ws-dev-app }

  DevAppRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DevAppSubnet
      RouteTableId: !Ref DevAppRouteTable

  DevCwanRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DevVpc
      Tags:
        - { Key: Name, Value: cwan-ws-dev-cwan }

  DevCwanRouteTableAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DevCwanSubnetA
      RouteTableId: !Ref DevCwanRouteTable

  DevCwanRouteTableAssocC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DevCwanSubnetC
      RouteTableId: !Ref DevCwanRouteTable

  DevAttachment:
    Type: AWS::NetworkManager::VpcAttachment
    Properties:
      CoreNetworkId: !GetAtt CoreNetwork.CoreNetworkId
      VpcArn: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${DevVpc}"
      SubnetArns:
        - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${DevCwanSubnetA}"
        - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${DevCwanSubnetC}"
      Options:
        ApplianceModeSupport: false
        Ipv6Support: false
      Tags:
        - Key: Name
          Value: !Sub
            - "cwan-ws-att-dev-${R}"
            - R: !FindInMap [RegionCode, !Ref "AWS::Region", Short]
        - { Key: segment, Value: dev }

  DevRouteCloudPrefix:
    Type: AWS::EC2::Route
    DependsOn: DevAttachment
    Properties:
      RouteTableId: !Ref DevAppRouteTable
      DestinationCidrBlock: 10.0.0.0/8
      CoreNetworkArn: !GetAtt CoreNetwork.CoreNetworkArn

  DevRouteOnPremPrefix:
    Type: AWS::EC2::Route
    DependsOn: DevAttachment
    Properties:
      RouteTableId: !Ref DevAppRouteTable
      DestinationCidrBlock: 172.16.0.0/12
      CoreNetworkArn: !GetAtt CoreNetwork.CoreNetworkArn

  DevS3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref DevVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref DevAppRouteTable]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Al2023Repos
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::al2023-repos-${AWS::Region}-*/*"

  DevEc2Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cwan-ws dev test EC2. Open to every lab CIDR on purpose.
      VpcId: !Ref DevVpc
      SecurityGroupIngress:
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 10.0.0.0/8, Description: ping from any lab VPC }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 10.0.0.0/8, Description: curl from any lab VPC }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 172.16.0.0/12, Description: ping from on-premises }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 172.16.0.0/12, Description: curl from on-premises }
      Tags:
        - { Key: Name, Value: cwan-ws-dev-ec2 }

  DevEiceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cwan-ws dev EICE, SSH out to the test EC2 only
      VpcId: !Ref DevVpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          DestinationSecurityGroupId: !Ref DevEc2Sg
          Description: SSH to the test EC2
      Tags:
        - { Key: Name, Value: cwan-ws-dev-eice }

  DevEc2SgSshFromEice:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DevEc2Sg
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId: !Ref DevEiceSg
      Description: SSH from EICE only

  # The dev EC2 needs a shell of its own: extra exercise 3-1 pings the Oregon
  # dev instance from here, and prod cannot reach dev - that block is exactly
  # what this workshop demonstrates.
  DevEice:
    Type: AWS::EC2::InstanceConnectEndpoint
    DependsOn: DevInstance  # its ENI must not take the instance's fixed IP
    Properties:
      SubnetId: !Ref DevAppSubnet
      SecurityGroupIds: [!Ref DevEiceSg]
      PreserveClientIp: false
      Tags:
        - { Key: Name, Value: cwan-ws-dev-eice }

  DevInstance:
    Type: AWS::EC2::Instance
    DependsOn: [DevS3Endpoint, DevAppRouteTableAssoc]
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeType: gp3, VolumeSize: 8, Encrypted: true, DeleteOnTermination: true }
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref DevAppSubnet
          GroupSet: [!Ref DevEc2Sg]
          PrivateIpAddress: 10.20.1.10
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            hostnamectl set-hostname ${Host}
            install -d -m 0755 /opt/cwanws
            cat > /opt/cwanws/whoami.py <<'PY'
            ${WhoAmI}
            PY
            cat > /etc/systemd/system/cwanws-whoami.service <<'UNIT'
            ${Unit}
            UNIT
            systemctl daemon-reload
            systemctl enable --now cwanws-whoami
            dnf install -y tcpdump bind-utils
          - Host: cwan-ws-dev
            WhoAmI: !FindInMap [Scripts, Http, Py]
            Unit: !FindInMap [Scripts, Http, Unit]
      Tags:
        - { Key: Name, Value: cwan-ws-dev-ec2 }

  # ================================================================ shared VPC
  SharedVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref SharedVpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: cwan-ws-vpc-shared }

  SharedAppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SharedVpc
      CidrBlock: 10.30.1.0/26
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: cwan-ws-shared-app-az1 }

  SharedCwanSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SharedVpc
      CidrBlock: 10.30.1.224/28
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: cwan-ws-shared-cwan-az1 }

  SharedCwanSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SharedVpc
      CidrBlock: 10.30.1.240/28
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - { Key: Name, Value: cwan-ws-shared-cwan-az2 }

  SharedAppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SharedVpc
      Tags:
        - { Key: Name, Value: cwan-ws-shared-app }

  SharedAppRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SharedAppSubnet
      RouteTableId: !Ref SharedAppRouteTable

  SharedCwanRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SharedVpc
      Tags:
        - { Key: Name, Value: cwan-ws-shared-cwan }

  SharedCwanRouteTableAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SharedCwanSubnetA
      RouteTableId: !Ref SharedCwanRouteTable

  SharedCwanRouteTableAssocC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SharedCwanSubnetC
      RouteTableId: !Ref SharedCwanRouteTable

  SharedAttachment:
    Type: AWS::NetworkManager::VpcAttachment
    Properties:
      CoreNetworkId: !GetAtt CoreNetwork.CoreNetworkId
      VpcArn: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${SharedVpc}"
      SubnetArns:
        - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${SharedCwanSubnetA}"
        - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${SharedCwanSubnetC}"
      Options:
        ApplianceModeSupport: false
        Ipv6Support: false
      Tags:
        - Key: Name
          Value: !Sub
            - "cwan-ws-att-shared-${R}"
            - R: !FindInMap [RegionCode, !Ref "AWS::Region", Short]
        - { Key: segment, Value: shared }

  SharedRouteCloudPrefix:
    Type: AWS::EC2::Route
    DependsOn: SharedAttachment
    Properties:
      RouteTableId: !Ref SharedAppRouteTable
      DestinationCidrBlock: 10.0.0.0/8
      CoreNetworkArn: !GetAtt CoreNetwork.CoreNetworkArn

  SharedRouteOnPremPrefix:
    Type: AWS::EC2::Route
    DependsOn: SharedAttachment
    Properties:
      RouteTableId: !Ref SharedAppRouteTable
      DestinationCidrBlock: 172.16.0.0/12
      CoreNetworkArn: !GetAtt CoreNetwork.CoreNetworkArn

  SharedS3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref SharedVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref SharedAppRouteTable]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Al2023Repos
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::al2023-repos-${AWS::Region}-*/*"

  SharedEc2Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cwan-ws shared test EC2. Open to every lab CIDR on purpose.
      VpcId: !Ref SharedVpc
      SecurityGroupIngress:
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 10.0.0.0/8, Description: ping from any lab VPC }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 10.0.0.0/8, Description: curl from any lab VPC }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 172.16.0.0/12, Description: ping from on-premises }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 172.16.0.0/12, Description: curl from on-premises }
      Tags:
        - { Key: Name, Value: cwan-ws-shared-ec2 }

  SharedInstance:
    Type: AWS::EC2::Instance
    DependsOn: [SharedS3Endpoint, SharedAppRouteTableAssoc]
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeType: gp3, VolumeSize: 8, Encrypted: true, DeleteOnTermination: true }
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SharedAppSubnet
          GroupSet: [!Ref SharedEc2Sg]
          PrivateIpAddress: 10.30.1.10
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            hostnamectl set-hostname ${Host}
            install -d -m 0755 /opt/cwanws
            cat > /opt/cwanws/whoami.py <<'PY'
            ${WhoAmI}
            PY
            cat > /etc/systemd/system/cwanws-whoami.service <<'UNIT'
            ${Unit}
            UNIT
            systemctl daemon-reload
            systemctl enable --now cwanws-whoami
            dnf install -y tcpdump bind-utils
          - Host: cwan-ws-shared
            WhoAmI: !FindInMap [Scripts, Http, Py]
            Unit: !FindInMap [Scripts, Http, Unit]
      Tags:
        - { Key: Name, Value: cwan-ws-shared-ec2 }

  # ========================================================= on-premises VPC
  # Deliberately NOT attached to the core network. It reaches AWS only through
  # the Site-to-Site VPN that the participant builds in lab 2-3.
  OnPremVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref OnPremVpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: cwan-ws-vpc-onprem }

  OnPremIgw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-igw }

  OnPremIgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref OnPremVpc
      InternetGatewayId: !Ref OnPremIgw

  # The inside LAN. 172.16.1.10 lives here, so it gets the first /26.
  OnPremPrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref OnPremVpc
      CidrBlock: 172.16.1.0/26
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-lan-az1 }

  OnPremPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref OnPremVpc
      CidrBlock: 172.16.1.64/26
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-wan-az1 }

  OnPremPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref OnPremVpc
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-wan }

  OnPremPublicRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref OnPremPublicSubnet
      RouteTableId: !Ref OnPremPublicRouteTable

  OnPremPublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: OnPremIgwAttachment
    Properties:
      RouteTableId: !Ref OnPremPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref OnPremIgw

  OnPremPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref OnPremVpc
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-lan }

  OnPremPrivateRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref OnPremPrivateSubnet
      RouteTableId: !Ref OnPremPrivateRouteTable

  # The LAN reaches AWS through the router, which puts it in the IPsec tunnels.
  OnPremPrivateRouteToRouter:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref OnPremPrivateRouteTable
      DestinationCidrBlock: 10.0.0.0/8
      NetworkInterfaceId: !Ref OnPremRouterEni

  # The LAN has no default route on purpose - it is "on-premises". This gateway
  # endpoint is only so that dnf works on the inside VM.
  OnPremS3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref OnPremVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref OnPremPrivateRouteTable]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Al2023Repos
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::al2023-repos-${AWS::Region}-*/*"

  OnPremEiceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cwan-ws on-premises EICE, SSH out to the router and the VM
      VpcId: !Ref OnPremVpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          DestinationSecurityGroupId: !Ref OnPremRouterSg
          Description: SSH to the VPN router
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          DestinationSecurityGroupId: !Ref OnPremVmSg
          Description: SSH to the inside VM
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-eice }

  OnPremRouterSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cwan-ws on-premises VPN router. IKE/NAT-T from the AWS VPN endpoints.
      VpcId: !Ref OnPremVpc
      SecurityGroupIngress:
        # The two AWS tunnel outside addresses are only known once the
        # participant creates the VPN connection, so these stay open.
        - { IpProtocol: udp, FromPort: 500, ToPort: 500, CidrIp: 0.0.0.0/0, Description: IKE from the AWS VPN endpoints }
        - { IpProtocol: udp, FromPort: 4500, ToPort: 4500, CidrIp: 0.0.0.0/0, Description: IPsec NAT-T from the AWS VPN endpoints }
        - { IpProtocol: "50", CidrIp: 0.0.0.0/0, Description: ESP from the AWS VPN endpoints }
        # All protocols and ports, because this carries the LAN's transit
        # traffic to AWS. It also reaches SSH on this instance, so the EICE
        # rule below is not the only path to port 22.
        - { IpProtocol: -1, CidrIp: 172.16.1.0/24, Description: "all ports from the on-premises VPC - carries the LAN transit traffic" }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 10.0.0.0/8, Description: ping from any lab VPC }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 10.0.0.0/8, Description: curl from any lab VPC }
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-router }

  OnPremRouterSgSshFromEice:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref OnPremRouterSg
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId: !Ref OnPremEiceSg
      Description: SSH from EICE (the VPC-wide rule on this group also reaches port 22)

  OnPremVmSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cwan-ws on-premises inside VM. Open to every lab CIDR on purpose.
      VpcId: !Ref OnPremVpc
      SecurityGroupIngress:
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 10.0.0.0/8, Description: ping from any lab VPC }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 10.0.0.0/8, Description: curl from any lab VPC }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 172.16.0.0/12, Description: ping from on-premises }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 172.16.0.0/12, Description: curl from on-premises }
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-vm }

  OnPremVmSgSshFromEice:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref OnPremVmSg
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId: !Ref OnPremEiceSg
      Description: SSH from EICE only

  OnPremEice:
    Type: AWS::EC2::InstanceConnectEndpoint
    DependsOn: OnPremVmInstance  # its ENI must not take the VM's fixed IP
    Properties:
      SubnetId: !Ref OnPremPrivateSubnet
      SecurityGroupIds: [!Ref OnPremEiceSg]
      PreserveClientIp: false
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-eice }

  # ------------------------------------------------- on-premises VPN router
  # A separate ENI so that SourceDestCheck can be turned off: the router
  # forwards the LAN's packets into the tunnels, so they are not addressed to it.
  OnPremRouterEni:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref OnPremPublicSubnet
      PrivateIpAddress: 172.16.1.70
      GroupSet: [!Ref OnPremRouterSg]
      SourceDestCheck: false
      Description: cwan-ws on-premises VPN router
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-router }

  OnPremRouterEip:
    Type: AWS::EC2::EIP
    DependsOn: OnPremIgwAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-router }

  OnPremRouterEipAssoc:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt OnPremRouterEip.AllocationId
      NetworkInterfaceId: !Ref OnPremRouterEni

  OnPremRouterRole:
    Type: AWS::IAM::Role
    Properties:
      Description: cwan-ws on-premises router - read its own stack metadata and the VPN connection configuration
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: describe-vpn-connections
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # DescribeVpnConnections does not support resource-level
              # permissions, so the resource has to be "*". The region
              # condition keeps the role from reading VPN configurations, and
              # therefore pre-shared keys, in any other region.
              - Effect: Allow
                Action: ec2:DescribeVpnConnections
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              # cfn-init reads this stack's resource metadata to lay down the
              # router scripts.
              - Effect: Allow
                Action: cloudformation:DescribeStackResource
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-router }

  OnPremRouterInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref OnPremRouterRole]

  OnPremRouterInstance:
    Type: AWS::EC2::Instance
    # Egress has to exist before the instance boots: cfn-init and dnf both
    # leave the VPC. Without the route and the Elastic IP association in this
    # list the bootstrap can start on an instance that cannot reach anything.
    DependsOn:
      - OnPremIgwAttachment
      - OnPremPublicRouteTableAssoc
      - OnPremPublicDefaultRoute
      - OnPremRouterEipAssoc
    # The three router scripts live here, not in UserData. Substituted into
    # UserData they came to 19,609 bytes against the 16,384 byte EC2 limit, so
    # the instance could not be created at all. cfn-init writes them from this
    # metadata instead; aws-cfn-bootstrap is already on the AL2023 AMI.
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          default: [scripts, bootstrap]
        scripts:
          files:
            /opt/onprem/install-packages.sh:
              content: !FindInMap [Scripts, Router, Install]
              mode: "000755"
              owner: root
              group: root
            /opt/onprem/setup-tunnels.sh:
              content: !FindInMap [Scripts, Router, Setup]
              mode: "000755"
              owner: root
              group: root
            /opt/onprem/parse-vpn-config.py:
              content: !FindInMap [Scripts, Router, Parse]
              mode: "000644"
              owner: root
              group: root
        bootstrap:
          commands:
            01-install-packages:
              command: /opt/onprem/install-packages.sh
    Properties:
      ImageId: !Ref RouterImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref OnPremRouterInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeType: gp3, VolumeSize: 8, Encrypted: true, DeleteOnTermination: true }
      NetworkInterfaces:
        - DeviceIndex: "0"
          NetworkInterfaceId: !Ref OnPremRouterEni
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -ux
          exec > >(tee -a /var/log/cwan-ws-router-bootstrap.log) 2>&1
          hostnamectl set-hostname cwan-ws-onprem-router
          echo 'net.ipv4.ip_forward=1' > /etc/sysctl.d/99-cwan-ws.conf
          sysctl -w net.ipv4.ip_forward=1
          install -d -m 0755 /opt/onprem
          # Wait for egress. DependsOn orders the stack resources, but the
          # Elastic IP and the route can still settle after this boots.
          for _ in $(seq 1 40); do
            timeout 5 bash -c "exec 3<>/dev/tcp/cloudformation.${AWS::Region}.amazonaws.com/443" 2>/dev/null && break
            sleep 15
          done
          if /opt/aws/bin/cfn-init -v --configsets default \
               --stack ${AWS::StackName} --resource OnPremRouterInstance \
               --region ${AWS::Region}; then
            rm -f /opt/onprem/BOOTSTRAP-FAILED
          else
            echo "read /var/log/cfn-init.log and /var/log/cwan-ws-router-bootstrap.log" > /opt/onprem/BOOTSTRAP-FAILED
          fi
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-router }

  # -------------------------------------------------- on-premises inside VM
  OnPremVmInstance:
    Type: AWS::EC2::Instance
    DependsOn: [OnPremS3Endpoint, OnPremPrivateRouteTableAssoc]
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeType: gp3, VolumeSize: 8, Encrypted: true, DeleteOnTermination: true }
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref OnPremPrivateSubnet
          GroupSet: [!Ref OnPremVmSg]
          PrivateIpAddress: 172.16.1.10
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            hostnamectl set-hostname ${Host}
            install -d -m 0755 /opt/cwanws
            cat > /opt/cwanws/whoami.py <<'PY'
            ${WhoAmI}
            PY
            cat > /etc/systemd/system/cwanws-whoami.service <<'UNIT'
            ${Unit}
            UNIT
            systemctl daemon-reload
            systemctl enable --now cwanws-whoami
            dnf install -y tcpdump bind-utils
          - Host: cwan-ws-onprem-vm
            WhoAmI: !FindInMap [Scripts, Http, Py]
            Unit: !FindInMap [Scripts, Http, Unit]
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-vm }

  # ===================================================== customer gateway
  # The VPN connection itself is created by the participant in lab 2-3, with
  # Target Gateway Type = Not Associated, so that it can be attached to the
  # core network. CloudFormation cannot create that kind of VPN connection.
  CustomerGateway:
    Type: AWS::EC2::CustomerGateway
    Properties:
      Type: ipsec.1
      BgpAsn: !Ref CustomerGatewayAsn
      IpAddress: !Ref OnPremRouterEip
      Tags:
        - { Key: Name, Value: cwan-ws-onprem-cgw }

Mappings:
  # Short Region codes for resource names. Cloud WAN puts attachments from both
  # Regions into the same segment, so the Region has to be in the name or the
  # console list shows two entries that look identical. Spelling out
  # "ap-northeast-2" makes the names too long to scan, hence the short form.
  # Running this workshop in another Region means adding its code here.
  RegionCode:
    ap-northeast-2: { Short: apne2 }
    us-west-2: { Short: usw2 }
    ap-northeast-1: { Short: apne1 }
    us-east-1: { Short: use1 }
    eu-west-1: { Short: euw1 }

  Scripts:
    # ------------------------------------------------------------------ test
    Http:
      Unit: |
        [Unit]
        Description=cwan-ws who-am-I HTTP server (TCP 80)
        Wants=network-online.target
        After=network-online.target
        [Service]
        ExecStart=/usr/bin/python3 -u /opt/cwanws/whoami.py
        Restart=always
        [Install]
        WantedBy=multi-user.target
      # Answers any HTTP GET on port 80 with the host name and the address the
      # server saw, so a curl shows which side answered. Every request is
      # logged, so `journalctl -u cwanws-whoami` shows who reached the host.
      Py: |
        import datetime, http.server, socket, socketserver
        HOST = socket.gethostname()
        def own_ip():
            # A UDP connect() sends nothing; it only asks the kernel which
            # address would be used. The link-local metadata address is always
            # routable, so this works before any Cloud WAN route exists.
            s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
            try:
                s.connect(("169.254.169.254", 80))
                return s.getsockname()[0]
            except OSError:
                return "unknown"
            finally:
                s.close()
        IP = own_ip()
        def log(msg):
            stamp = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="milliseconds")
            print(stamp, msg, flush=True)
        class H(http.server.BaseHTTPRequestHandler):
            server_version = "cwan-ws/1.0"
            def do_GET(self):
                ip, port = self.client_address[:2]
                log("http from %s:%s %s" % (ip, port, self.path))
                body = ("you reached %s (%s)\nI saw you as %s:%s\n" % (HOST, IP, ip, port)).encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; charset=utf-8")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def log_message(self, *a):
                pass
        class S(socketserver.ThreadingMixIn, http.server.HTTPServer):
            daemon_threads = True
            allow_reuse_address = True
        log("listening on 0.0.0.0:80 as %s (%s)" % (HOST, IP))
        S(("0.0.0.0", 80), H).serve_forever()

    # ---------------------------------------------------------------- router
    Router:
      # Installs strongSwan (swanctl) and FRR (vtysh).
      #
      # On Amazon Linux 2023 these come from SPAL (Supplementary Packages for
      # Amazon Linux), not from the core repository. `spal-release` IS in the
      # core repository and drops in /etc/yum.repos.d/amazonlinux-spal.repo;
      # after that `dnf install strongswan frr` works. Checked on AL2023
      # aarch64: strongswan 6.0.6-1.1.spal2023, frr 10.4.1-2.1.spal2023. SPAL
      # packages are as-is, outside AWS Enterprise Support, and patched only
      # when EPEL 9 upstream patches them - acceptable for a two-hour lab.
      #
      # Package names differ from Debian and Ubuntu: here swanctl ships inside
      # the strongswan package, and strongswan-swanctl, charon-systemd and
      # frr-pythontools do not exist. The config directories and the systemd
      # unit name differ too, so setup-tunnels.sh discovers them at run time
      # instead of assuming either layout.
      Install: |
        #!/bin/bash
        set -uo pipefail
        exec > >(tee -a /var/log/cwan-ws-router-bootstrap.log) 2>&1

        say() { printf '\n==> %s\n' "$*"; }
        die() { printf '\n!!! ROUTER BOOTSTRAP FAILED: %s\n\n' "$*" >&2; exit 1; }

        # Egress may still be settling when cloud-init runs, and repository
        # mirrors sometimes stall, so every repository call gets retries.
        retry() {
            local n=1 max=10
            until "$@"; do
                if [ "$n" -ge "$max" ]; then
                    return 1
                fi
                printf '    attempt %d of %d failed, retrying in 15s: %s\n' "$n" "$max" "$*"
                n=$((n + 1))
                sleep 15
            done
        }

        say "installing the IPsec and BGP packages"
        if command -v dnf >/dev/null 2>&1; then
            say "enabling the SPAL repository"
            retry dnf install -y spal-release \
                || die "could not install spal-release from the core repository. Without SPAL this AMI has no strongswan and no frr package. Check that the instance can reach the Amazon Linux repositories."
            [ -f /etc/yum.repos.d/amazonlinux-spal.repo ] \
                || die "spal-release is installed but /etc/yum.repos.d/amazonlinux-spal.repo is missing"
            say "installing strongswan and frr from SPAL"
            retry dnf install -y strongswan frr iproute jq python3 tcpdump unzip \
                || die "dnf could not install strongswan and frr. Run 'dnf repoquery strongswan frr' to see what the repositories offer."
        elif command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            retry apt-get update -y || die "apt-get update failed"
            retry apt-get install -y \
                strongswan strongswan-swanctl charon-systemd \
                frr frr-pythontools \
                iproute2 jq python3 tcpdump unzip curl ca-certificates \
                || die "apt-get install failed"
        else
            die "no supported package manager found (looked for dnf and apt-get)"
        fi

        say "checking that swanctl and vtysh really arrived"
        command -v swanctl >/dev/null 2>&1 || die "swanctl is still missing after the install"
        command -v vtysh   >/dev/null 2>&1 || die "vtysh is still missing after the install"
        say "$(swanctl --version 2>/dev/null | head -1) / $(rpm -q frr 2>/dev/null || echo frr)"

        say "making sure the AWS CLI is available"
        if ! command -v aws >/dev/null 2>&1; then
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/awscli.zip" \
                "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" \
                || die "could not download the AWS CLI"
            unzip -q -d "$tmp" "$tmp/awscli.zip" || die "could not unpack the AWS CLI"
            "$tmp/aws/install" >/dev/null || die "could not install the AWS CLI"
            rm -rf "$tmp"
        fi

        say "enabling bgpd in FRR"
        [ -f /etc/frr/daemons ] || die "/etc/frr/daemons is missing, is FRR installed?"
        sed -i 's/^bgpd=no$/bgpd=yes/' /etc/frr/daemons
        grep -q '^bgpd=yes$' /etc/frr/daemons || die "could not enable bgpd in /etc/frr/daemons"
        systemctl enable frr >/dev/null 2>&1 || true
        systemctl restart frr || die "frr did not start"

        say "ready. Run /opt/onprem/setup-tunnels.sh <vpn-connection-id> after you create the VPN connection."

      # Reads the AWS side of a Site-to-Site VPN connection and writes a
      # shell-sourceable file. Keeping the XML parsing in Python keeps
      # setup-tunnels.sh readable and makes a bad XML an explicit error.
      Parse: |
        """Turn a CustomerGatewayConfiguration XML into shell variables."""
        import shlex
        import sys
        import xml.etree.ElementTree as ET


        def fail(msg):
            sys.stderr.write("parse-vpn-config: %s\n" % msg)
            raise SystemExit(2)


        def text(node, *path):
            for part in path:
                if node is None:
                    return None
                node = node.find(part)
            if node is None or node.text is None:
                return None
            return node.text.strip()


        def aws_side(tunnel):
            """The AWS end is <vpn_gateway> for a VGW or TGW connection. A
            Cloud WAN connection may name it differently, so fall back to the
            one child that is not the customer or the crypto configuration."""
            node = tunnel.find("vpn_gateway")
            if node is not None:
                return node
            known = {"customer_gateway", "ike", "ipsec"}
            for child in tunnel:
                if child.tag not in known and child.find("tunnel_outside_address") is not None:
                    return child
            return None


        def main():
            if len(sys.argv) != 2:
                fail("usage: parse-vpn-config.py <configuration.xml>")
            try:
                root = ET.parse(sys.argv[1]).getroot()
            except ET.ParseError as exc:
                fail("the configuration is not valid XML: %s" % exc)

            tunnels = root.findall("ipsec_tunnel")
            if len(tunnels) != 2:
                fail("expected 2 <ipsec_tunnel> elements, found %d" % len(tunnels))

            out = []
            for index, tunnel in enumerate(tunnels, start=1):
                cgw = tunnel.find("customer_gateway")
                aws = aws_side(tunnel)
                if cgw is None or aws is None:
                    fail("tunnel %d has no customer_gateway or no AWS gateway" % index)

                fields = {
                    "CGW_OUTSIDE": text(cgw, "tunnel_outside_address", "ip_address"),
                    "CGW_INSIDE": text(cgw, "tunnel_inside_address", "ip_address"),
                    "CGW_INSIDE_PREFIX": text(cgw, "tunnel_inside_address", "network_cidr"),
                    "CGW_ASN": text(cgw, "bgp", "asn"),
                    "AWS_OUTSIDE": text(aws, "tunnel_outside_address", "ip_address"),
                    "AWS_INSIDE": text(aws, "tunnel_inside_address", "ip_address"),
                    "AWS_ASN": text(aws, "bgp", "asn"),
                    "PSK": text(tunnel, "ike", "pre_shared_key"),
                }
                for key, value in fields.items():
                    if not value:
                        fail("tunnel %d is missing %s - is BGP enabled on this "
                             "VPN connection?" % (index, key))
                    out.append("T%d_%s=%s" % (index, key, shlex.quote(value)))

            # Both tunnels always carry the same ASNs; export them once too.
            out.append("CGW_ASN=%s" % shlex.quote(text(tunnels[0].find("customer_gateway"), "bgp", "asn")))
            out.append("AWS_ASN=%s" % shlex.quote(text(aws_side(tunnels[0]), "bgp", "asn")))
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()

      # The one command a participant runs on the router in lab 2-3.
      Setup: |
        #!/bin/bash
        #
        #   sudo /opt/onprem/setup-tunnels.sh vpn-0123456789abcdef0
        #
        # Reads the AWS configuration of that Site-to-Site VPN connection and
        # builds both IPsec tunnels (strongSwan) and both BGP sessions (FRR),
        # advertising the on-premises LAN. Safe to run again.
        set -uo pipefail

        REGION="ap-northeast-2"
        LAN_CIDR="172.16.1.0/24"
        WORKDIR="/opt/onprem"
        XML="${WORKDIR}/vpn-config.xml"
        ENVFILE="${WORKDIR}/tunnels.env"
        VTI_SCRIPT="${WORKDIR}/vti-up.sh"

        step() { printf '\n==> [%s] %s\n' "$(date -u +%H:%M:%S)" "$*"; }
        ok()   { printf '    ok   %s\n' "$*"; }
        die()  { printf '\n!!! FAILED at: %s\n    %s\n\n' "${CURRENT_STEP:-start}" "$*" >&2; exit 1; }

        # ---------------------------------------------------------- 1. checks
        CURRENT_STEP="checking the arguments and the host"
        step "$CURRENT_STEP"
        VPN_ID="${1:-}"
        case "$VPN_ID" in
            vpn-*) ok "VPN connection id ${VPN_ID}" ;;
            "")    die "give the VPN connection id, for example: sudo $0 vpn-0123456789abcdef0" ;;
            *)     die "'${VPN_ID}' does not look like a VPN connection id (it must start with vpn-)" ;;
        esac
        [ "$(id -u)" = "0" ] || die "run this with sudo"
        if [ -f "${WORKDIR}/BOOTSTRAP-FAILED" ]; then
            die "the router bootstrap did not finish. Read /var/log/cwan-ws-router-bootstrap.log"
        fi
        for tool in aws swanctl vtysh ip python3; do
            command -v "$tool" >/dev/null 2>&1 || die "'$tool' is not installed. Read /var/log/cwan-ws-router-bootstrap.log"
        done
        ok "swanctl, vtysh, aws and python3 are present"

        CURRENT_STEP="reading this router's own addresses"
        step "$CURRENT_STEP"
        TOKEN="$(curl -fsS -X PUT http://169.254.169.254/latest/api/token \
            -H 'X-aws-ec2-metadata-token-ttl-seconds: 300')" || die "could not reach the instance metadata service"
        imds() { curl -fsS -H "X-aws-ec2-metadata-token: ${TOKEN}" "http://169.254.169.254/latest/meta-data/$1"; }
        LOCAL_IP="$(imds local-ipv4)"  || die "could not read local-ipv4"
        PUBLIC_IP="$(imds public-ipv4)" || die "could not read public-ipv4 - is the Elastic IP associated?"
        # The LAN subnet sits behind the VPC subnet router, which is always the
        # first host address of this interface's own subnet. FRR needs it as a
        # next hop; see the BGP step for why a blackhole cannot be used.
        MAC="$(imds mac)" || die "could not read the interface MAC"
        SUBNET_CIDR="$(imds "network/interfaces/macs/${MAC}/subnet-ipv4-cidr-block")" \
            || die "could not read this interface's subnet CIDR"
        LAN_GATEWAY="$(python3 -c 'import ipaddress, sys; print(next(ipaddress.ip_network(sys.argv[1]).hosts()))' "$SUBNET_CIDR")" \
            || die "could not work out the VPC subnet router for ${SUBNET_CIDR}"
        KERNEL_GATEWAY="$(ip -4 route show default | awk '{print $3; exit}')"
        if [ -n "$KERNEL_GATEWAY" ] && [ "$KERNEL_GATEWAY" != "$LAN_GATEWAY" ]; then
            printf '    note the default route uses %s but this subnet router is %s.\n' \
                "$KERNEL_GATEWAY" "$LAN_GATEWAY"
        fi
        ok "private ${LOCAL_IP}, public ${PUBLIC_IP}, subnet ${SUBNET_CIDR}, VPC router ${LAN_GATEWAY}"

        # ----------------------------------------- 2. the VPN configuration
        CURRENT_STEP="downloading the VPN connection configuration"
        step "$CURRENT_STEP"
        # The configuration contains both pre-shared keys. Create the file
        # before the redirection so that it is never world-readable.
        install -m 0600 /dev/null "$XML" || die "could not create ${XML}"
        aws ec2 describe-vpn-connections \
            --vpn-connection-ids "$VPN_ID" \
            --region "$REGION" \
            --query 'VpnConnections[0].CustomerGatewayConfiguration' \
            --output text > "$XML" \
            || die "describe-vpn-connections failed. Check the id and that the instance role allows ec2:DescribeVpnConnections"
        [ -s "$XML" ] && [ "$(head -c 5 "$XML")" != "None" ] \
            || die "AWS returned no configuration for ${VPN_ID}. Wait until it leaves the 'pending' state and try again"
        ok "configuration saved to ${XML}"

        CURRENT_STEP="reading the tunnel addresses, pre-shared keys and ASNs"
        step "$CURRENT_STEP"
        python3 "${WORKDIR}/parse-vpn-config.py" "$XML" > "${ENVFILE}.new" \
            || die "could not read the tunnel details out of ${XML}"
        mv "${ENVFILE}.new" "$ENVFILE"
        chmod 0600 "$ENVFILE"
        # shellcheck disable=SC1090
        . "$ENVFILE"
        ok "tunnel 1 ${LOCAL_IP} -> ${T1_AWS_OUTSIDE}, inside ${T1_CGW_INSIDE} <-> ${T1_AWS_INSIDE}"
        ok "tunnel 2 ${LOCAL_IP} -> ${T2_AWS_OUTSIDE}, inside ${T2_CGW_INSIDE} <-> ${T2_AWS_INSIDE}"
        ok "BGP local AS ${CGW_ASN}, AWS AS ${AWS_ASN}"
        if [ "$PUBLIC_IP" != "$T1_CGW_OUTSIDE" ]; then
            printf '    note the customer gateway says %s but this router is %s.\n' \
                "$T1_CGW_OUTSIDE" "$PUBLIC_IP"
            die "the VPN connection points at a different customer gateway. Use the one named cwan-ws-onprem-cgw"
        fi

        # -------------------------------------------------- 3. IPsec tunnels
        CURRENT_STEP="finding the strongSwan configuration directories"
        step "$CURRENT_STEP"
        # Amazon Linux 2023 (SPAL) keeps these under /etc/strongswan/, Debian
        # and Ubuntu keep them at the top of /etc/. Both top-level swanctl.conf
        # files end with `include conf.d/*.conf`, so a drop-in is enough.
        SWANCTL_DIR=""
        for d in /etc/strongswan/swanctl /etc/swanctl; do
            if [ -d "$d" ]; then
                SWANCTL_DIR="$d"
                break
            fi
        done
        [ -n "$SWANCTL_DIR" ] || die "found no swanctl directory (looked in /etc/strongswan/swanctl and /etc/swanctl)"
        STRONGSWAN_D=""
        for d in /etc/strongswan/strongswan.d /etc/strongswan.d; do
            if [ -d "$d" ]; then
                STRONGSWAN_D="$d"
                break
            fi
        done
        [ -n "$STRONGSWAN_D" ] || die "found no strongswan.d directory (looked in /etc/strongswan/strongswan.d and /etc/strongswan.d)"
        install -d -m 0750 "${SWANCTL_DIR}/conf.d"
        if ! grep -qE '^[[:space:]]*include[[:space:]]+conf\.d/\*\.conf' "${SWANCTL_DIR}/swanctl.conf" 2>/dev/null; then
            printf '\ninclude conf.d/*.conf\n' >> "${SWANCTL_DIR}/swanctl.conf"
        fi
        ok "swanctl ${SWANCTL_DIR}, strongswan.d ${STRONGSWAN_D}"

        CURRENT_STEP="stopping strongSwan from installing its own routes"
        step "$CURRENT_STEP"
        # This is a route-based (VTI) VPN, so FRR owns the routing table. The
        # traffic selectors are 0.0.0.0/0: if charon installed routes for them
        # it would put a default route in table 220 and black-hole the router's
        # own traffic, the IPsec packets included.
        cat > "${STRONGSWAN_D}/99-cwan-ws.conf" <<'SWANCONF'
        charon {
            install_routes = no
        }
        SWANCONF
        ok "${STRONGSWAN_D}/99-cwan-ws.conf written"

        CURRENT_STEP="writing the strongSwan connection configuration"
        step "$CURRENT_STEP"
        # AES256/SHA256/DH14 is inside the set AWS accepts by default. The
        # AES128 line is a second proposal, not a weaker fallback: strongSwan
        # 6.0 no longer loads the sha1 plugin by default, so a sha1/modp1024
        # proposal could not be offered here anyway.
        write_conn() {
            local n="$1" aws_outside="$2"
            cat <<CONN
            aws-tunnel${n} {
                version = 2
                local_addrs = ${LOCAL_IP}
                remote_addrs = ${aws_outside}
                encap = yes
                keyingtries = 0
                dpd_delay = 10s
                rekey_time = 8h
                over_time = 30m
                proposals = aes256-sha256-modp2048,aes128-sha256-modp2048
                local {
                    id = ${PUBLIC_IP}
                    auth = psk
                }
                remote {
                    id = ${aws_outside}
                    auth = psk
                }
                children {
                    aws-tunnel${n} {
                        local_ts = 0.0.0.0/0
                        remote_ts = 0.0.0.0/0
                        mode = tunnel
                        start_action = start
                        close_action = start
                        dpd_action = restart
                        rekey_time = 50m
                        esp_proposals = aes256-sha256-modp2048,aes128-sha256-modp2048
                        mark_in = ${n}
                        mark_out = ${n}
                    }
                }
            }
        CONN
        }
        write_secret() {
            local n="$1" aws_outside="$2" psk="$3"
            cat <<SECRET
            ike-aws-tunnel${n} {
                id = ${aws_outside}
                secret = "${psk}"
            }
        SECRET
        }
        # One `connections` section and one `secrets` section, so the result
        # does not depend on how the parser merges two sections of one name.
        {
            echo "connections {"
            write_conn 1 "$T1_AWS_OUTSIDE"
            write_conn 2 "$T2_AWS_OUTSIDE"
            echo "}"
            echo "secrets {"
            write_secret 1 "$T1_AWS_OUTSIDE" "$T1_PSK"
            write_secret 2 "$T2_AWS_OUTSIDE" "$T2_PSK"
            echo "}"
        } > "${SWANCTL_DIR}/conf.d/cwan-ws.conf" || die "could not write ${SWANCTL_DIR}/conf.d/cwan-ws.conf"
        chmod 0600 "${SWANCTL_DIR}/conf.d/cwan-ws.conf"
        ok "${SWANCTL_DIR}/conf.d/cwan-ws.conf written"

        CURRENT_STEP="creating the vti1 and vti2 interfaces"
        step "$CURRENT_STEP"
        # Written to a file and run from a unit as well, so a reboot rebuilds
        # the interfaces without another describe-vpn-connections call.
        cat > "$VTI_SCRIPT" <<VTI
        #!/bin/bash
        set -uo pipefail
        sysctl -qw net.ipv4.ip_forward=1
        add_vti() {
            local n="\$1" local_ip="\$2" remote_ip="\$3" inside="\$4" prefix="\$5" peer="\$6"
            ip link del "vti\${n}" 2>/dev/null
            ip link add "vti\${n}" type vti local "\${local_ip}" remote "\${remote_ip}" key "\${n}" || return 1
            ip addr add "\${inside}/\${prefix}" remote "\${peer}/\${prefix}" dev "vti\${n}" || return 1
            ip link set "vti\${n}" up mtu 1419 || return 1
            sysctl -qw "net.ipv4.conf.vti\${n}.disable_policy=1"
            sysctl -qw "net.ipv4.conf.vti\${n}.rp_filter=0"
        }
        add_vti 1 ${LOCAL_IP} ${T1_AWS_OUTSIDE} ${T1_CGW_INSIDE} ${T1_CGW_INSIDE_PREFIX} ${T1_AWS_INSIDE} || exit 1
        add_vti 2 ${LOCAL_IP} ${T2_AWS_OUTSIDE} ${T2_CGW_INSIDE} ${T2_CGW_INSIDE_PREFIX} ${T2_AWS_INSIDE} || exit 1
        VTI
        chmod 0755 "$VTI_SCRIPT"
        "$VTI_SCRIPT" || die "could not create the vti interfaces. Run 'ip -d link show vti1' to see why"
        cat > /etc/systemd/system/cwan-ws-vti.service <<UNIT
        [Unit]
        Description=cwan-ws VPN router vti interfaces
        After=network-online.target
        Wants=network-online.target
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=${VTI_SCRIPT}
        [Install]
        WantedBy=multi-user.target
        UNIT
        systemctl daemon-reload
        systemctl enable cwan-ws-vti >/dev/null 2>&1
        ok "vti1 and vti2 are up"

        CURRENT_STEP="starting strongSwan and loading the tunnels"
        step "$CURRENT_STEP"
        # The legacy starter unit drives the daemon from ipsec.conf and fights
        # with the swanctl one, so only one of them may run.
        systemctl disable --now strongswan-starter >/dev/null 2>&1
        # Unit names differ per distribution, and on Amazon Linux both units
        # come out of the same package, so choose by what the unit actually
        # runs: charon-systemd is the swanctl-driven daemon.
        SWAN_UNIT=""
        for unit in strongswan.service strongswan-swanctl.service charon-systemd.service; do
            if systemctl cat "$unit" 2>/dev/null | grep -q 'ExecStart=.*charon-systemd'; then
                SWAN_UNIT="$unit"
                break
            fi
        done
        [ -n "$SWAN_UNIT" ] || die "found no strongSwan unit that runs charon-systemd. Run 'systemctl cat strongswan.service' and read /var/log/cwan-ws-router-bootstrap.log"
        ok "using ${SWAN_UNIT}"
        systemctl enable "$SWAN_UNIT" >/dev/null 2>&1
        systemctl restart "$SWAN_UNIT" || die "${SWAN_UNIT} did not start. Run 'journalctl -u ${SWAN_UNIT}'"
        for _ in $(seq 1 15); do
            swanctl --stats >/dev/null 2>&1 && break
            sleep 1
        done
        swanctl --stats >/dev/null 2>&1 || die "charon is not answering. Run 'journalctl -u ${SWAN_UNIT}'"
        swanctl --load-all || die "swanctl could not load the configuration"
        ok "${SWAN_UNIT} is running and the tunnels are loaded"

        CURRENT_STEP="waiting for the IPsec security associations"
        step "$CURRENT_STEP"
        UP=0
        for _ in $(seq 1 60); do
            UP="$(swanctl --list-sas 2>/dev/null | grep -c 'ESTABLISHED')"
            [ "$UP" -ge 2 ] && break
            sleep 2
        done
        if [ "$UP" = "1" ]; then
            printf '    WARNING: only one of the two tunnels is up. The lab expects two.\n'
            printf '    Run swanctl --list-sas to see which one is missing.\n'
        fi
        if [ "$UP" -lt 1 ]; then
            printf '    no security association came up after two minutes.\n'
            printf '    Check: the security group allows UDP 500 and 4500 from the AWS tunnel\n'
            printf '    outside addresses %s and %s, and the VPN connection uses customer\n' \
                "$T1_AWS_OUTSIDE" "$T2_AWS_OUTSIDE"
            printf '    gateway address %s.\n' "$PUBLIC_IP"
            die "no IPsec tunnel came up. Run 'swanctl --list-sas' and 'journalctl -u ${SWAN_UNIT}'"
        fi
        ok "${UP} IPsec security association(s) established"

        # ---------------------------------------------------- 4. BGP with FRR
        CURRENT_STEP="configuring BGP in FRR"
        step "$CURRENT_STEP"
        grep -q '^bgpd=yes$' /etc/frr/daemons || die "bgpd is not enabled in /etc/frr/daemons"
        systemctl is-active --quiet frr || systemctl restart frr || die "frr did not start"
        # 'no bgp ebgp-requires-policy' is needed from FRR 7.4 on, otherwise FRR
        # neither accepts nor advertises anything without a route-map.
        #
        # The static route gives the 'network' statement a matching prefix to
        # advertise. It must point at the VPC subnet router, NOT at a blackhole:
        # the LAN subnet is a different subnet in this VPC, reached through that
        # router, and this prefix covers it. A blackhole here is more specific
        # than the default route and silently drops every packet to the inside
        # VM and to the EC2 Instance Connect Endpoint, SSH replies included.
        vtysh <<BGP || die "vtysh rejected the BGP configuration"
        configure terminal
        ip route ${LAN_CIDR} ${LAN_GATEWAY}
        router bgp ${CGW_ASN}
         bgp router-id ${T1_CGW_INSIDE}
         no bgp ebgp-requires-policy
         neighbor ${T1_AWS_INSIDE} remote-as ${T1_AWS_ASN}
         neighbor ${T1_AWS_INSIDE} timers 10 30
         neighbor ${T2_AWS_INSIDE} remote-as ${T2_AWS_ASN}
         neighbor ${T2_AWS_INSIDE} timers 10 30
         address-family ipv4 unicast
          network ${LAN_CIDR}
          neighbor ${T1_AWS_INSIDE} activate
          neighbor ${T2_AWS_INSIDE} activate
         exit-address-family
        exit
        exit
        write memory
        BGP
        ok "BGP ${CGW_ASN} configured, advertising ${LAN_CIDR}"

        CURRENT_STEP="waiting for the BGP sessions"
        step "$CURRENT_STEP"
        ESTABLISHED=0
        for _ in $(seq 1 45); do
            ESTABLISHED="$(vtysh -c 'show bgp summary json' 2>/dev/null \
                | python3 -c 'import json,sys; d=json.load(sys.stdin).get("ipv4Unicast",{}).get("peers",{}); print(sum(1 for p in d.values() if p.get("state")=="Established"))' \
                2>/dev/null || echo 0)"
            [ "$ESTABLISHED" -ge 2 ] && break
            sleep 2
        done
        if [ "$ESTABLISHED" = "1" ]; then
            printf '    WARNING: only one of the two BGP sessions is up. The lab expects two.\n'
            printf '    Run vtysh -c "show bgp summary" to see which neighbour is down.\n'
        fi
        if [ "$ESTABLISHED" -lt 1 ]; then
            printf '    no BGP session came up after 90 seconds.\n'
            printf '    Check that the Cloud WAN VPN attachment exists and is Available:\n'
            printf '    a VPN connection with no attachment has no BGP speaker on the AWS side.\n'
            die "no BGP session came up. Run 'vtysh -c \"show bgp summary\"'"
        fi
        ok "${ESTABLISHED} BGP session(s) established"

        # ------------------------------------------------------- 5. summary
        step "done"
        printf '\n'
        swanctl --list-sas | grep -E 'aws-tunnel|ESTABLISHED|INSTALLED' || true
        printf '\n'
        vtysh -c 'show bgp summary' || true
        printf '\n'
        vtysh -c 'show ip route bgp' || true
        cat <<'NEXT'

        Next:
          swanctl --list-sas                  the two IPsec tunnels
          vtysh -c 'show bgp summary'         the two BGP sessions
          vtysh -c 'show ip route bgp'        the routes Cloud WAN sends you
          vtysh -c 'show ip bgp neighbors <peer> advertised-routes'

        From the inside VM (172.16.1.10):
          ping 10.30.1.10                     shared, should answer
          ping 10.10.1.10                     prod, should NOT answer until lab 2-4

        NEXT

Outputs:
  CoreNetworkId:
    Description: Core network id. Needed for every attachment you create in the console.
    Value: !GetAtt CoreNetwork.CoreNetworkId
    Export: { Name: !Sub "${AWS::StackName}-CoreNetworkId" }
  CoreNetworkArn:
    Description: Core network ARN.
    Value: !GetAtt CoreNetwork.CoreNetworkArn
    Export: { Name: !Sub "${AWS::StackName}-CoreNetworkArn" }
  GlobalNetworkId:
    Description: Global network id.
    Value: !GetAtt GlobalNetwork.Id
    Export: { Name: !Sub "${AWS::StackName}-GlobalNetworkId" }
  ProdInstancePrivateIp:
    Description: prod test instance. Ping targets live here.
    Value: !GetAtt ProdInstance.PrivateIp
  DevInstancePrivateIp:
    Description: dev test instance. prod must NOT reach this.
    Value: !GetAtt DevInstance.PrivateIp
  SharedInstancePrivateIp:
    Description: shared services test instance. prod, dev and on-premises must all reach this.
    Value: !GetAtt SharedInstance.PrivateIp
  OnPremVmPrivateIp:
    Description: on-premises inside VM. Ping AWS from here.
    Value: !GetAtt OnPremVmInstance.PrivateIp
  OnPremRouterPrivateIp:
    Description: on-premises VPN router, inside address.
    Value: !GetAtt OnPremRouterEni.PrimaryPrivateIpAddress
  OnPremRouterPublicIp:
    Description: Elastic IP of the on-premises VPN router. This is the customer gateway address.
    Value: !Ref OnPremRouterEip
    Export: { Name: !Sub "${AWS::StackName}-OnPremRouterPublicIp" }
  CustomerGatewayId:
    Description: Pick this customer gateway when you create the Site-to-Site VPN connection in lab 2-3.
    Value: !Ref CustomerGateway
    Export: { Name: !Sub "${AWS::StackName}-CustomerGatewayId" }
  ProdAttachmentId:
    Description: prod VPC attachment. Should land in the prod segment.
    Value: !GetAtt ProdAttachment.AttachmentId
  DevAttachmentId:
    Description: dev VPC attachment. Should land in the dev segment.
    Value: !GetAtt DevAttachment.AttachmentId
  SharedAttachmentId:
    Description: shared VPC attachment. Should land in the shared segment.
    Value: !GetAtt SharedAttachment.AttachmentId
  ProdEiceId:
    Description: EC2 Instance Connect Endpoint for the prod VPC.
    Value: !Ref ProdEice
  DevEiceId:
    Description: EC2 Instance Connect Endpoint for the dev VPC.
    Value: !Ref DevEice
  OnPremEiceId:
    Description: EC2 Instance Connect Endpoint for the on-premises VPC. Reaches both the router and the VM.
    Value: !Ref OnPremEice
  SetupTunnelsCommand:
    Description: Run this on the on-premises router in lab 2-3, with the id of the VPN connection you created.
    Value: sudo /opt/onprem/setup-tunnels.sh <vpn-connection-id>
