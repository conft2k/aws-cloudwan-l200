AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AWS Cloud WAN workshop (L200), Oregon (us-west-2): prod VPC (10.11.1.0/24)
  with one test EC2 instance (10.11.1.10), one EC2 Instance Connect Endpoint and
  two subnets reserved for the Cloud WAN VPC attachment. You create the VPC
  attachment (tag segment=prod) and the routes to the core network in the
  console during the workshop.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: AWS cloud (leave the defaults) }
        Parameters:
          - InstanceType
          - ImageId

Parameters:
  InstanceType:
    Type: String
    Default: t4g.micro
    Description: Instance type of the test EC2. Leave the default.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Amazon Linux 2023 arm64 AMI from the SSM public parameter. Leave the default.

Rules:
  OregonOnly:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-west-2]
        AssertDescription: This template is for the Oregon (us-west-2) Region only.

Resources:
  # ---------------------------------------------------------------- prod VPC
  ProdVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.11.1.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: cwan-ws-prod-vpc }

  ProdAppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProdVpc
      CidrBlock: 10.11.1.0/26
      AvailabilityZone: !Select [0, !GetAZs ""]   # the Region's first AZ
      Tags:
        - { Key: Name, Value: cwan-ws-prod-app-az1 }

  ProdAttSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProdVpc
      CidrBlock: 10.11.1.224/28
      AvailabilityZone: !Select [0, !GetAZs ""]   # the Region's first AZ
      Tags:
        - { Key: Name, Value: cwan-ws-prod-att-az1 }

  ProdAttSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProdVpc
      CidrBlock: 10.11.1.240/28
      AvailabilityZone: !Select [1, !GetAZs ""]   # the Region's second AZ (attachment ENIs only)
      Tags:
        - { Key: Name, Value: cwan-ws-prod-att-az2 }

  # The app route table has no Cloud WAN routes on purpose: the participant adds
  # 10.0.0.0/8 and 172.16.0.0/12 -> core network after creating the attachment.
  ProdAppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ProdVpc
      Tags:
        - { Key: Name, Value: cwan-ws-prod-app }

  ProdAppRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProdAppSubnet
      RouteTableId: !Ref ProdAppRouteTable

  ProdAttRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ProdVpc
      Tags:
        - { Key: Name, Value: cwan-ws-prod-att }

  ProdAttRouteTableAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProdAttSubnetA
      RouteTableId: !Ref ProdAttRouteTable

  ProdAttRouteTableAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProdAttSubnetB
      RouteTableId: !Ref ProdAttRouteTable

  ProdEiceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cwan-ws EICE, SSH out to the test EC2 only
      VpcId: !Ref ProdVpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          DestinationSecurityGroupId: !Ref ProdEc2Sg
          Description: SSH to the test EC2
      Tags:
        - { Key: Name, Value: cwan-ws-prod-eice }

  # Isolation between segments is done by Cloud WAN, not by this security group.
  ProdEc2Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cwan-ws test EC2, ICMP and HTTP from 10.0.0.0/8 and 172.16.0.0/12
      VpcId: !Ref ProdVpc
      SecurityGroupIngress:
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 10.0.0.0/8, Description: ping from 10.0.0.0/8 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 10.0.0.0/8, Description: HTTP from 10.0.0.0/8 }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 172.16.0.0/12, Description: ping from 172.16.0.0/12 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 172.16.0.0/12, Description: HTTP from 172.16.0.0/12 }
      Tags:
        - { Key: Name, Value: cwan-ws-prod-ec2 }

  ProdEc2SgSshFromEice:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ProdEc2Sg
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId: !Ref ProdEiceSg
      Description: SSH from EICE only

  ProdEice:
    Type: AWS::EC2::InstanceConnectEndpoint
    DependsOn: ProdInstance  # its ENI must not take the instance's fixed IP
    Properties:
      SubnetId: !Ref ProdAppSubnet
      SecurityGroupIds: [!Ref ProdEiceSg]
      PreserveClientIp: false
      Tags:
        - { Key: Name, Value: cwan-ws-prod-eice }

  ProdInstance:
    Type: AWS::EC2::Instance
    DependsOn: ProdAppRouteTableAssoc
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeType: gp3, VolumeSize: 8, Encrypted: true, DeleteOnTermination: true }
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref ProdAppSubnet
          GroupSet: [!Ref ProdEc2Sg]
          PrivateIpAddress: 10.11.1.10
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            hostnamectl set-hostname ${Host}
            install -d /opt/cwan
            cat > /opt/cwan/echo.py <<'PY'
            ${EchoServer}
            PY
            cat > /etc/systemd/system/cwan-echo.service <<'UNIT'
            [Unit]
            Description=cwan workshop echo server (TCP 80 HTTP)
            Wants=network-online.target
            After=network-online.target
            [Service]
            ExecStart=/usr/bin/python3 -u /opt/cwan/echo.py
            Restart=always
            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable --now cwan-echo
          - Host: oregon-prod-ec2
            EchoServer: !FindInMap [Scripts, Echo, Py]
      Tags:
        - { Key: Name, Value: cwan-ws-prod-ec2 }

  # ---------------------------------------------------------------- dev VPC (no attachment, no EICE)
  DevVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.21.1.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: cwan-ws-dev-vpc }

  DevAppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DevVpc
      CidrBlock: 10.21.1.0/26
      AvailabilityZone: !Select [0, !GetAZs ""]   # the Region's first AZ
      Tags:
        - { Key: Name, Value: cwan-ws-dev-app-az1 }

  DevAttSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DevVpc
      CidrBlock: 10.21.1.224/28
      AvailabilityZone: !Select [0, !GetAZs ""]   # the Region's first AZ
      Tags:
        - { Key: Name, Value: cwan-ws-dev-att-az1 }

  DevAttSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DevVpc
      CidrBlock: 10.21.1.240/28
      AvailabilityZone: !Select [1, !GetAZs ""]   # the Region's second AZ (attachment ENIs only)
      Tags:
        - { Key: Name, Value: cwan-ws-dev-att-az2 }

  DevAppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DevVpc
      Tags:
        - { Key: Name, Value: cwan-ws-dev-app }

  DevAppRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DevAppSubnet
      RouteTableId: !Ref DevAppRouteTable

  DevAttRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DevVpc
      Tags:
        - { Key: Name, Value: cwan-ws-dev-att }

  DevAttRouteTableAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DevAttSubnetA
      RouteTableId: !Ref DevAttRouteTable

  DevAttRouteTableAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DevAttSubnetB
      RouteTableId: !Ref DevAttRouteTable

  DevEc2Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cwan-ws test EC2, ICMP and HTTP from 10.0.0.0/8 and 172.16.0.0/12
      VpcId: !Ref DevVpc
      SecurityGroupIngress:
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 10.0.0.0/8, Description: ping from 10.0.0.0/8 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 10.0.0.0/8, Description: HTTP from 10.0.0.0/8 }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 172.16.0.0/12, Description: ping from 172.16.0.0/12 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 172.16.0.0/12, Description: HTTP from 172.16.0.0/12 }
      Tags:
        - { Key: Name, Value: cwan-ws-dev-ec2 }

  DevInstance:
    Type: AWS::EC2::Instance
    DependsOn: DevAppRouteTableAssoc
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeType: gp3, VolumeSize: 8, Encrypted: true, DeleteOnTermination: true }
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref DevAppSubnet
          GroupSet: [!Ref DevEc2Sg]
          PrivateIpAddress: 10.21.1.10
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            hostnamectl set-hostname ${Host}
            install -d /opt/cwan
            cat > /opt/cwan/echo.py <<'PY'
            ${EchoServer}
            PY
            cat > /etc/systemd/system/cwan-echo.service <<'UNIT'
            [Unit]
            Description=cwan workshop echo server (TCP 80 HTTP)
            Wants=network-online.target
            After=network-online.target
            [Service]
            ExecStart=/usr/bin/python3 -u /opt/cwan/echo.py
            Restart=always
            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable --now cwan-echo
          - Host: oregon-dev-ec2
            EchoServer: !FindInMap [Scripts, Echo, Py]
      Tags:
        - { Key: Name, Value: cwan-ws-dev-ec2 }

Mappings:
  Scripts:
    Echo:
      # TCP 80: HTTP GET answers with the host name and the client address the
      # server saw. Every request is logged (journalctl -u cwan-echo).
      # Ping needs no software. Same behavior as the Seoul template.
      Py: |
        import socket, datetime, http.server, socketserver
        HOST = socket.gethostname()
        def log(msg):
            print(datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="milliseconds"), msg, flush=True)
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                ip, port = self.client_address[:2]
                body = f"{HOST} saw {ip}:{port}\n".encode()
                log(f"tcp80 from {ip}:{port} {self.path}")
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def log_message(self, *a):
                pass
        class S(socketserver.ThreadingMixIn, http.server.HTTPServer):
            daemon_threads = True
            allow_reuse_address = True
        S(("0.0.0.0", 80), H).serve_forever()

Outputs:
  ProdVpcId:
    Description: Prod VPC (10.11.1.0/24). Select it when you create the prod Cloud WAN VPC attachment (tag segment=prod).
    Value: !Ref ProdVpc
  ProdAttSubnetAId:
    Description: Prod subnet for the attachment, AZ 1 (10.11.1.224/28).
    Value: !Ref ProdAttSubnetA
  ProdAttSubnetBId:
    Description: Prod subnet for the attachment, AZ 2 (10.11.1.240/28).
    Value: !Ref ProdAttSubnetB
  ProdInstancePrivateIp:
    Description: Private IP of the prod test EC2.
    Value: !GetAtt ProdInstance.PrivateIp
  ProdInstanceId:
    Value: !Ref ProdInstance
  ProdAppRouteTableId:
    Description: Add the routes for 10.0.0.0/8 and 172.16.0.0/12 to this route table after the prod attachment is available.
    Value: !Ref ProdAppRouteTable
  ProdEiceId:
    Description: EC2 Instance Connect Endpoint of the prod VPC (the only one in this stack).
    Value: !Ref ProdEice
  DevVpcId:
    Description: Dev VPC (10.21.1.0/24). Select it when you create the dev Cloud WAN VPC attachment (tag segment=dev) in the extra exercise.
    Value: !Ref DevVpc
  DevAttSubnetAId:
    Description: Dev subnet for the attachment, AZ 1 (10.21.1.224/28).
    Value: !Ref DevAttSubnetA
  DevAttSubnetBId:
    Description: Dev subnet for the attachment, AZ 2 (10.21.1.240/28).
    Value: !Ref DevAttSubnetB
  DevInstancePrivateIp:
    Description: Private IP of the dev test EC2.
    Value: !GetAtt DevInstance.PrivateIp
  DevInstanceId:
    Value: !Ref DevInstance
  DevAppRouteTableId:
    Description: Add the routes for 10.0.0.0/8 and 172.16.0.0/12 to this route table after the dev attachment is available.
    Value: !Ref DevAppRouteTable
