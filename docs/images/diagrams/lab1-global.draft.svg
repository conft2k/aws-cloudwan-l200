<text x="546" y="402" font-size="16" font-weight="600" fill="#1D8102">성공: 응답 있음</text>
<rect x="16" y="730" width="1130" height="170" fill="#F8F9F9" stroke="#D5DBDB" stroke-width="1"/>
<circle cx="44" cy="754.5" r="10.5" fill="#232F3E"/>
<text x="44" y="760" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="66" y="760" font-size="16" font-weight="600" fill="#232F3E">서울 prod → 서울 dev (실패)</text>
<text x="345.6" y="760" font-size="16" fill="#3B4552">세그먼트는 기본 격리. 보안 그룹은 ICMP 허용인데도 경로가 없어 100% 유실.</text>
<circle cx="44" cy="784.5" r="10.5" fill="#232F3E"/>
<text x="44" y="790" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="66" y="790" font-size="16" font-weight="600" fill="#232F3E">서울 prod → 서울 shared (성공)</text>
<text x="345.6" y="790" font-size="16" fill="#3B4552">정책의 share(shared → prod·dev·onprem)로 shared 경로만 prod에 전파.</text>
<circle cx="44" cy="814.5" r="10.5" fill="#232F3E"/>
<text x="44" y="820" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="66" y="820" font-size="16" font-weight="600" fill="#232F3E">오레곤 prod attachment 생성</text>
<text x="345.6" y="820" font-size="16" fill="#3B4552">참가자가 VPC attachment를 만들고 segment=prod 태그를 붙입니다.</text>
<circle cx="44" cy="844.5" r="10.5" fill="#232F3E"/>
<text x="44" y="850" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<text x="66" y="850" font-size="16" font-weight="600" fill="#232F3E">attachment policy 규칙 100</text>
<text x="345.6" y="850" font-size="16" fill="#3B4552">tag-exists: segment 조건이 태그 값대로 prod 세그먼트에 자동 배정 (참가자가 고르지 않음).</text>
<circle cx="44" cy="874.5" r="10.5" fill="#232F3E"/>
<text x="44" y="880" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
<text x="66" y="880" font-size="16" font-weight="600" fill="#232F3E">서울 prod → 오레곤 prod (성공)</text>
<text x="345.6" y="880" font-size="16" fill="#3B4552">서울 edge AS 64512 ↔ 오레곤 edge AS 64513은 이미 연결. prod 경로가 리전 간 자동 전파.</text>
