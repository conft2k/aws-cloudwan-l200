<text x="42" y="306.5" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<text x="62" y="306" font-size="16" fill="#232F3E">172.16.1.10 → shared EC2 10.30.1.10 : 성공</text>
<text x="62" y="326" font-size="16" fill="#3B4552">shared 가 onprem 에도 share 되어 있다</text>
<circle cx="42" cy="349" r="10.5" fill="#232F3E"/>
<text x="42" y="354.5" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
<text x="62" y="354" font-size="16" fill="#232F3E">172.16.1.10 → prod EC2 10.10.1.10 : 실패(차단)</text>
<text x="62" y="374" font-size="16" fill="#3B4552">onprem ↔ prod 공유 없음 → 실습 2-4에서 share 추가</text>
