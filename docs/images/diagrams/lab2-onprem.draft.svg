<text x="62" y="258" font-size="16" fill="#3B4552">sudo /opt/onprem/setup-tunnels.sh &lt;vpn 연결 ID&gt; 실행</text>
<text x="62" y="278" font-size="16" fill="#3B4552">터널 2개 UP · BGP 65000 ↔ 64512 · 172.16.1.0/24 광고</text>
