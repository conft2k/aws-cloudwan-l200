<text x="576" y="682" font-size="16" font-family="'Noto Sans Mono CJK KR', monospace" fill="#232F3E">  "segment": "onprem",</text>
<text x="576" y="704" font-size="16" font-family="'Noto Sans Mono CJK KR', monospace" fill="#232F3E">  "share-with": ["prod"]</text>
